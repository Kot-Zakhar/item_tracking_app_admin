<form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
  <h2 mat-dialog-title>{{ title }}</h2>

  <mat-dialog-content class="form-vertical">
    <mat-label>{{ 'common.title' | translate }}</mat-label>
    <mat-form-field>
      @if (categoryForm.value.icon) {
        <mat-icon matPrefix class="pl-3 material-symbols-outlined">{{ categoryForm.value.icon }}</mat-icon>
      }
      <input matInput required formControlName="title" placeholder="{{ 'common.title' | translate }}" />
    </mat-form-field>

    <app-icon-picker
      [selectedIcon]="categoryForm.value.icon ?? null"
      (onIconSelected)="onIconSelect($event)"
    ></app-icon-picker>
  </mat-dialog-content>
  
  <mat-dialog-actions>
    <button mat-button type="button" (click)="dialogRef.close()">
      {{ 'common.actionVerbs.cancel' | translate }}
    </button>
    <button mat-flat-button type="submit" color="primary" [disabled]="!categoryForm.valid">
      {{ 'common.actionVerbs.save' | translate }}
    </button>
  </mat-dialog-actions>

</form>
