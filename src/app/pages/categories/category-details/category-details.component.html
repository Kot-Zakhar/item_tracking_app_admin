<div class="space-y-4 flex flex-col">
  <div class="flex items-center justify-between">
    <div class="flex items-center justify-start">
      <button mat-icon-button [routerLink]="['..']">
        <mat-icon class="material-symbols-outlined">arrow_back</mat-icon>
      </button>
      <h1 class="text-lg font-bold">
        {{ 'categoryDetails.title' | translate }}
      </h1>
    </div>

    @if (category) {
      <div class="hidden md:flex items-center space-x-4">
        <button
          mat-flat-button
          color="primary"
          matTooltip="{{ 'shared.viewOnItemsPage' | translate }}"
          [routerLink]="['../../items']"
          [queryParams]="{ category: category.id }"
          (click)="$event.stopPropagation()"
        >
          <mat-icon class="material-symbols-outlined">arrow_outward</mat-icon>
          {{ 'shared.associatedItems' | translate }}
        </button>

        <button
          mat-flat-button
          color="primary"
          (click)="onEdit()"
        >
          <mat-icon class="material-symbols-outlined">edit</mat-icon>
          {{ 'common.actionVerbs.edit' | translate }}
        </button>
   
        <button
          mat-flat-button
          color="warn"
          (click)="onDelete()"
        >
          <mat-icon class="material-symbols-outlined">delete</mat-icon>
          {{ 'common.actionVerbs.delete' | translate }}
        </button>
      </div>
      <div class="md:hidden flex items-center">
        <button
          mat-icon-button
          matTooltip="{{ 'shared.viewOnItemsPage' | translate }}"
          [routerLink]="['../../items']"
          [queryParams]="{ category: category.id }"
          (click)="$event.stopPropagation()"
        >
          <mat-icon class="material-symbols-outlined">arrow_outward</mat-icon>
        </button>

        <button
          mat-icon-button
          (click)="onEdit()"
        >
          <mat-icon class="material-symbols-outlined">edit</mat-icon>
        </button>
   
        <button
          mat-icon-button
          (click)="onDelete()"
        >
          <mat-icon class="material-symbols-outlined">delete</mat-icon>
        </button>
      </div>
    }
  </div>

  <mat-card class="my-4">
    @if (!category) {
      <div class="flex items-center justify-center">
        <mat-progress-spinner diameter="32"></mat-progress-spinner>
      </div>
    } @else {
      <mat-card-header>
        <mat-card-title>{{ category.name }}</mat-card-title>
      </mat-card-header>

      <div class="my-4">
        <mat-divider></mat-divider>
      </div>

      <mat-card-content>
        <div class="flex row items-start justify-between">
          <table>
            <tbody>
              <tr>
                <td class="font-medium pr-4">
                  {{ 'common.title' | translate }}
                </td>
                <td class="italic">{{ category.name }}</td>
              </tr>
              <tr>
                <td class="font-medium pr-4">
                  {{ 'common.icon' | translate }}
                </td>
                <td>
                  @if (category.icon) {
                    <mat-icon class="material-symbols-outlined">{{ category.icon }}</mat-icon>
                  } @else {
                    <span class="italic">
                      {{ 'common.noIcon' | translate }}
                    </span>
                  }
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </mat-card-content>
    }
  </mat-card>

</div>
