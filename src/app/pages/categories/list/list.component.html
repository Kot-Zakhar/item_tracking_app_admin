<div class="p-10 space-y-8">
  <div class="flex items-center justify-between">
    <h1 class="text-lg font-bold">Categories</h1>
    <button mat-flat-button color="primary" (click)="onNewCategoryClick()">
      <mat-icon class="material-symbols-outlined">add</mat-icon>
      New Category
    </button>
  </div>

  @if (loading) {
    <mat-progress-bar mode="indeterminate" class="ms-8"></mat-progress-bar>
  }

  @if (dataSource.data) {
    <div class="p-4 border dark:border-inverse rounded-lg overflow-hidden">
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
        <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
          <ng-container *ngTemplateOutlet="categoryTemplate; context: { $implicit: node }"></ng-container>
        </mat-tree-node>
    
        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
          <ng-container *ngTemplateOutlet="categoryTemplate; context: { $implicit: node }"></ng-container>
          
          <div class="pl-12">
            <ng-container matTreeNodeOutlet></ng-container>
          </div>
        </mat-nested-tree-node>
      </mat-tree>
    </div>
  }
</div>

<ng-template #categoryTemplate let-category>
  <div class="category">
    <span>{{ category.title }}</span>
    <div class="category__actions">
      <button mat-icon-button matTooltip="Add sub-category" color="primary" (click)="onNewCategoryClick(category)">
        <mat-icon class="material-symbols-outlined">add</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Edit category" (click)="onEditCategoryClick(category)">
        <mat-icon class="material-symbols-outlined">edit</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Delete category" (click)="onDeleteCategoryClick(category)">
        <mat-icon class="material-symbols-outlined">delete</mat-icon>
      </button>
    </div>
  </div>
</ng-template>
