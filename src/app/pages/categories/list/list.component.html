<div class="p-10 space-y-8">
  <div class="flex items-center justify-between">
    <h1 class="text-lg font-bold">Categories</h1>
    <button mat-flat-button color="primary" (click)="onNewCategoryClick()">
      <mat-icon class="material-symbols-outlined">add</mat-icon>
      New Category
    </button>
  </div>

  @if (loading) {
    <mat-progress-bar mode="indeterminate" class="ms-8"></mat-progress-bar>
  }

  @if (dataSource.data) {
    <div class="border dark:border-inverse rounded-lg overflow-hidden">
      <div class="p-4 category">
        <span>Category</span>
        <div class="category__spacer"></div>
        <div class="category__count">
          <span class="count total-count">Associated items</span>
        </div>
        <div class="category__actions">
          <span>Actions</span>
        </div>
      </div>
      <mat-divider></mat-divider>
      <div class="p-4 ">
        <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
          <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
            <ng-container *ngTemplateOutlet="categoryTemplate; context: { $implicit: node }"></ng-container>
          </mat-tree-node>
      
          <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
            <ng-container *ngTemplateOutlet="categoryTemplate; context: { $implicit: node }"></ng-container>
            
            <div class="pl-12">
              <ng-container matTreeNodeOutlet></ng-container>
            </div>
          </mat-nested-tree-node>
        </mat-tree>
      </div>
    </div>
  }
</div>

<ng-template #categoryTemplate let-details>
  <div class="category">
    <span>{{ details.category.title }}</span>
    <div class="category__spacer"></div>
    <div class="category__count">
      <span class="count total-count">{{ details.itemsAmount }}</span>
    </div>
    <div class="category__actions">
      <button mat-icon-button matTooltip="Add sub-category" color="primary" (click)="onNewCategoryClick(details.category)">
        <mat-icon class="material-symbols-outlined">add</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Edit category" (click)="onEditCategoryClick(details.category)">
        <mat-icon class="material-symbols-outlined">edit</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Delete category" (click)="onDeleteCategoryClick(details.category)">
        <mat-icon class="material-symbols-outlined">delete</mat-icon>
      </button>
    </div>
  </div>
</ng-template>
