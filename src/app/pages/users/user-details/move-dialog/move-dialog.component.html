<h2 mat-dialog-title>
  {{ 'users.selectLocation' | translate }}
</h2>

<mat-dialog-content>
  <mat-action-list>
    @for (location of locations; track location.id) {
      <button mat-list-item (click)="selectLocation(location)">
        {{ location | location }}
      </button>
    }
  </mat-action-list>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close>
    {{ 'common.actionVerbs.cancel' | translate }}
  </button>
</mat-dialog-actions>
