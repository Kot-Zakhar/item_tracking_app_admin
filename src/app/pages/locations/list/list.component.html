<div class="p-10 space-y-8">
  <div class="flex locations-center justify-between">
    <h1 class="text-lg font-bold">Locations</h1>
    <button mat-flat-button color="primary" (click)="create()">
      <mat-icon class="material-symbols-outlined">add</mat-icon>
      New location
    </button>
  </div>

  <div class="border dark:border-inverse rounded-lg overflow-hidden">
    <table mat-table [dataSource]="locations" class="mat-elevation-z8">

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> Title </th>
        <td mat-cell *matCellDef="let element">{{ element.title }}</td>
      </ng-container>
    
      <ng-container matColumnDef="floor">
        <th mat-header-cell *matHeaderCellDef> Floor </th>
        <td mat-cell *matCellDef="let element">{{ element.floor }}</td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef> Code </th>
        <td mat-cell *matCellDef="let element">{{ element.code }}</td>
      </ng-container>
    
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element"> 
          <button mat-icon-button color="primary" (click)="edit(element); $event.stopPropagation()">
            <mat-icon class="material-symbols-outlined">edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(element); $event.stopPropagation()">
            <mat-icon class="material-symbols-outlined">delete</mat-icon>
          </button>
        </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;"
        class="hover:bg-primary-50 dark:hover:bg-neutral-700 row"
      ></tr>
        <!-- [routerLink]="[row.id]" -->
    </table>
  </div>
</div>
