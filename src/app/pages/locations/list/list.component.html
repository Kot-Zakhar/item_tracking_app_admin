<div class="px-10 py-4 space-y-4 flex flex-col max-h-full">
  <div class="flex locations-center justify-between">
    <div class="flex items-center space-x-4">
      <h1 class="text-lg font-bold">Locations</h1>
      <mat-divider [vertical]="true" class="h-6"></mat-divider>
      <mat-button-toggle-group [value]="withAssociatedItems" (change)="onWithAssociatedItemsChange($event)"> 
        <mat-button-toggle [value]="false">All</mat-button-toggle>
        <mat-button-toggle [value]="true">With Associated Items</mat-button-toggle>
      </mat-button-toggle-group>

      <mat-divider [vertical]="true" class="h-6"></mat-divider>

      <input
        matInput
        type="text"
        placeholder="Search..."
        class="border-b h-10 w-48 text-sm bg-transparent dark:border-b-inverse outline-0 focus-within:border-neutral-950"
        (input)="onSearch($event)"
      >
    </div>
    <button mat-flat-button color="primary" (click)="create()">
      <mat-icon class="material-symbols-outlined">add</mat-icon>
      New location
    </button>
  </div>

  <div class="border dark:border-inverse rounded-lg overflow-auto">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
        <td mat-cell *matCellDef="let element">{{ element.location.title }}</td>
      </ng-container>
    
      <ng-container matColumnDef="floor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Floor </th>
        <td mat-cell *matCellDef="let element">{{ element.location.floor }}</td>
      </ng-container>

      <ng-container matColumnDef="itemsAmount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Associated items </th>
        <td mat-cell *matCellDef="let element">
          <div class="flex items-center">
            {{ element.itemsAmount }}
            @if (element.itemsAmount > 0) {
              <a
                mat-icon-button
                [routerLink]="['../items']"
                [queryParams]="{ location: element.location.id }"
                (click)="$event.stopPropagation()"
              >
                <mat-icon class="material-symbols-outlined">arrow_outward</mat-icon>
              </a>
            }
          </div>
        </td>
      </ng-container>
    
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element"> 
          <a mat-icon-button [href]="getQrHref(element)" matTooltip="Open QR code" target="_blank">
            <mat-icon class="material-symbols-outlined">qr_code</mat-icon>
          </a>
          <button mat-icon-button color="primary" matTooltip="Edit location" (click)="edit(element); $event.stopPropagation()">
            <mat-icon class="material-symbols-outlined">edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Delete location" (click)="delete(element); $event.stopPropagation()">
            <mat-icon class="material-symbols-outlined">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="paginator">
        <td mat-footer-cell *matFooterCellDef [attr.colspan]="displayedColumns.length">
          <mat-paginator [pageSize]="10"></mat-paginator>
        </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;"
        class="hover:bg-primary-50 dark:hover:bg-neutral-800 cursor-pointer"
        queryParamsHandling="preserve"
        [routerLink]="[row.location.id]"
      ></tr>
      <ng-template matNoDataRow>
        <tr>
          <td class="text-center" [attr.colspan]="displayedColumns.length">
            <div class="flex justify-center items-center h-32 w-full dark:text-neutral-400 text-neutral-500">No data found</div>
          </td>
        </tr>
      </ng-template>
      <tr mat-footer-row *matFooterRowDef="['paginator']; sticky: true"></tr>
    </table>
  </div>
</div>
