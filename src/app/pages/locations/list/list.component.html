<div class="p-10 space-y-8">
  <div class="flex locations-center justify-between">
    <h1 class="text-lg font-bold">Locations</h1>
    <button mat-flat-button color="primary" (click)="create()">
      <mat-icon class="material-symbols-outlined">add</mat-icon>
      New location
    </button>
  </div>

  <div class="border dark:border-inverse rounded-lg overflow-auto">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="sortData($event)">

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
        <td mat-cell *matCellDef="let element">{{ element.location.title }}</td>
      </ng-container>
    
      <ng-container matColumnDef="floor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Floor </th>
        <td mat-cell *matCellDef="let element">{{ element.location.floor }}</td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef> Code </th>
        <td mat-cell *matCellDef="let element">{{ element.location.code }}</td>
      </ng-container>

      <ng-container matColumnDef="itemsAmount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Items amount </th>
        <td mat-cell *matCellDef="let element">{{ element.itemsAmount }}</td>
      </ng-container>
    
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element"> 

          <a mat-icon-button [href]="getQrHref(element)" matTooltip="Open QR code" target="_blank">
            <mat-icon class="material-symbols-outlined">qr_code</mat-icon>
          </a>
          <button mat-icon-button color="primary" matTooltip="Edit location" (click)="edit(element); $event.stopPropagation()">
            <mat-icon class="material-symbols-outlined">edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Delete location" (click)="delete(element); $event.stopPropagation()">
            <mat-icon class="material-symbols-outlined">delete</mat-icon>
          </button>
        </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;"
        class="hover:bg-primary-50 dark:hover:bg-neutral-700 row"
      ></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
