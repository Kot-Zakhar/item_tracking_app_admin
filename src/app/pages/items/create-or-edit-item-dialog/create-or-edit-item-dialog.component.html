<form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
  <h2 mat-dialog-title>{{ title }}</h2>

  <mat-dialog-content class="form-vertical">
    <mat-form-field>
      <input matInput required formControlName="name" placeholder="Name" />
    </mat-form-field>
    <mat-form-field>
      <textarea matInput formControlName="description" placeholder="Description"></textarea>
    </mat-form-field>

    <div class="my-2">
      @if (categoriesLoaded) {
        @if (!selectedCategory) {
          <button mat-flat-button type="button" color="warn" [matMenuTriggerFor]="categoriesMenu">Select Category</button>
        } @else {
          <div class="flex items-center justify-between flex-row">
            <span> {{selectedCategory.title}} </span>
            <button mat-icon-button type="button" color="primary" [matMenuTriggerFor]="categoriesMenu">
              <mat-icon class="material-symbols-outlined">category</mat-icon>
            </button>
          </div>
        }
      } @else {
        <mat-progress-spinner diameter="32"></mat-progress-spinner>
      }
  
      <mat-menu #categoriesMenu="matMenu" yPosition="below">
        <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
          <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
            <button mat-menu-item (click)="onCategorySelect(node)">{{node.title}}</button>
          </mat-tree-node>
      
          <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
            <button mat-menu-item (click)="onCategorySelect(node)">{{node.title}}</button>
            
            <div class="pl-12">
              <ng-container matTreeNodeOutlet></ng-container>
            </div>
          </mat-nested-tree-node>
        </mat-tree>
      </mat-menu>
    </div>

    <div class="my-2">
      <input type="file" class="hidden" (change)="onFileChange($event)" #fileInput accept="image/png, image/jpeg, image/jpg"/>

      @if (uploadProgress) {
        <mat-progress-spinner
          diameter="12"
          mode="determinate"
          [value]="uploadProgress"
        ></mat-progress-spinner>
      } @else {
        @if (itemImgSrc) {
          <div class="flex items-center justify-between flex-row">
            <img [src]="itemImgSrc" class="w-12 h-12" />
            <button mat-icon-button type="button" color="primary" (click)="fileInput.click()">
              <mat-icon class="material-symbols-outlined">cached</mat-icon>
            </button>
            <button mat-icon-button type="button" color="warn" (click)="onDeleteImage()">
              <mat-icon class="material-symbols-outlined">delete</mat-icon>
            </button>
          </div>
        } @else {
          <button mat-flat-button type="button" color="primary" (click)="fileInput.click()">
            <mat-icon class="material-symbols-outlined">attach_file</mat-icon>
            Upload Image
          </button>
        }
      }
    </div>

    <!-- <mat-checkbox class="py-4" formControlName="visibility">Visible</mat-checkbox> -->
  </mat-dialog-content>
  
  <mat-dialog-actions>
    <button mat-button type="button" (click)="dialogRef.close()">Cancel</button>
    <button mat-flat-button type="submit" color="primary" [disabled]="!itemForm.valid" >Save</button>
  </mat-dialog-actions>
</form>
