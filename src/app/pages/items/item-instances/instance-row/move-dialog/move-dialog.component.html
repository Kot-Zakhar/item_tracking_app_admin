<h2 mat-dialog-title>Select room</h2>

<mat-dialog-content>
  <mat-action-list>
    @for (room of rooms; track room.id) {
      <button mat-list-item (click)="selectRoom(room)">
        Floor {{ room.floor }}, {{ room.title }}
      </button>
    }
  </mat-action-list>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
