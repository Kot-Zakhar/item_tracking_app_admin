<h2 mat-dialog-title>Select location</h2>

<mat-dialog-content>
  <mat-action-list>
    @for (location of locations; track location.id) {
      <button mat-list-item (click)="selectLocation(location)">
        {{ location | location }}
      </button>
    }
  </mat-action-list>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
