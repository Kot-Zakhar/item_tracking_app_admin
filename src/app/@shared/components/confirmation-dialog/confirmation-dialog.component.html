<h2 mat-dialog-title>{{ data.title ?? 'Perform this action?' }}</h2>

@if (data.message) {
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
}

<mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">Cancel</button>
  <button mat-flat-button [color]="data.warn ? 'warn' : 'primary'" [mat-dialog-close]="true" cdkFocusInitial>{{ data.confirmButtonText ?? 'Ok' }}</button>
</mat-dialog-actions>
