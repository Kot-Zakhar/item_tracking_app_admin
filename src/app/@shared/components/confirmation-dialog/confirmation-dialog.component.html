<h2 mat-dialog-title>{{ data.title ?? 'Perform this action?' }}</h2>

@if (data.message) {
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
}

<mat-dialog-actions>
  <button mat-button type="button" [mat-dialog-close]="false">
  {{ (data.cancelButtonText ?? 'common.cancel') | translate }}
  </button>
  <button mat-flat-button type="submit" [color]="data.warn ? 'warn' : 'primary'" [mat-dialog-close]="true" cdkFocusInitial>{{ (data.confirmButtonText ?? 'common.ok') | translate }}</button>
</mat-dialog-actions>
